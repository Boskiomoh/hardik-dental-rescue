project_id = "mmsmljkeedqfrbgsqipf"

[functions.chat-with-gemini]
# Allow public access - rate limiting is handled in the function itself
verify_jwt = false

# Expose the "before" schema too, so the untouched copy of the app can run
# against the same project (see audit/build-before-schema.mjs).
[api]
schemas = ["public", "graphql_public", "before"]
extra_search_path = ["public", "extensions"]

# Stripe calls this directly; it checks Stripe's signature instead of a JWT.
[functions.stripe-webhook]
verify_jwt = false

# Sign-in, sign-up and password-reset links go to the deployed fixed app.
[auth]
site_url = "https://hardik-dental-after.vercel.app"
additional_redirect_urls = ["https://hardik-dental-after.vercel.app/**", "http://localhost:8081/**"]
